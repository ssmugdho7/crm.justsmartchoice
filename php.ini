; ============================================================
; SMART CHOICE CRM - PHP 8.5 PRODUCTION CONFIGURATION
; Domain: crm.justsmartchoice.com
; Environment: Bluehost / cPanel / ea-php85
; ============================================================

; ------------------------------------------------------------
; ERROR HANDLING - PRODUCTION
; ------------------------------------------------------------

display_errors = Off
display_startup_errors = Off
log_errors = On
html_errors = Off
ignore_repeated_errors = On
ignore_repeated_source = Off
report_memleaks = On

; Do not expose PHP version information
expose_php = Off

; ------------------------------------------------------------
; UPLOAD AND POST LIMITS
; Bluehost shared-hosting documented maximums
; ------------------------------------------------------------

upload_max_filesize = 512M
post_max_size = 516M

; Number of files permitted in one request
max_file_uploads = 100

; ------------------------------------------------------------
; MEMORY AND EXECUTION
; ------------------------------------------------------------

memory_limit = 2048M

; Five minutes for normal CRM web operations
max_execution_time = 300

; Five minutes for parsing large uploads/forms
max_input_time = 300

; Prevent large CRM forms, estimates and module settings
; from losing fields after the first 1,000 inputs
max_input_vars = 10000

max_input_nesting_level = 128

; ------------------------------------------------------------
; SESSION CONFIGURATION
; ------------------------------------------------------------

; Seven-day PHP session data lifetime
session.gc_maxlifetime = 604800

; Keep current Bluehost PHP 8.5 session location
session.save_path = "/var/cpanel/php/sessions/alt-php85"

session.use_strict_mode = On
session.use_only_cookies = On
session.use_cookies = On
session.use_trans_sid = Off
session.cookie_httponly = On
session.cookie_samesite = "Lax"
session.cookie_secure = On

; Increase session identifier strength
session.sid_length = 48
session.sid_bits_per_character = 6

; ------------------------------------------------------------
; OUTPUT AND REQUEST PROCESSING
; ------------------------------------------------------------

output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off

default_charset = "UTF-8"

; ------------------------------------------------------------
; FILESYSTEM AND PATH PERFORMANCE
; ------------------------------------------------------------

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; ------------------------------------------------------------
; OPCACHE PERFORMANCE
; These settings apply only when OPcache is available/enabled
; ------------------------------------------------------------

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 50000
opcache.max_wasted_percentage = 10
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1
opcache.enable_file_override = 0

; PHP 8+ JIT is not recommended for this CRM workload
opcache.jit = 0
opcache.jit_buffer_size = 0

; ------------------------------------------------------------
; DATABASE / NETWORK TIMEOUTS
; ------------------------------------------------------------

default_socket_timeout = 300
mysqli.connect_timeout = 30
mysqlnd.net_read_timeout = 300

; ------------------------------------------------------------
; TEMPORARY FILE AND FILE ACCESS SETTINGS
; ------------------------------------------------------------

file_uploads = On
allow_url_fopen = On
allow_url_include = Off

; ------------------------------------------------------------
; SECURITY
; ------------------------------------------------------------

enable_dl = Off
cgi.fix_pathinfo = 0

; ------------------------------------------------------------
; DATE AND TIME
; ------------------------------------------------------------

date.timezone = "America/New_York"

; ------------------------------------------------------------
; PRECISION
; ------------------------------------------------------------

precision = 14
serialize_precision = -1
